// ── Jupiter: fill scores into Jupiter's own export, the only format it imports ──
function parseDelimited(text, d) {
  const rows = []; let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cell += ch;
    } else if (ch === '"' && cell === '') quoted = true;
    else if (ch === d) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function toDelimited(rows, d) {
  return rows.map(r => r.map(v => {
    const s = String(v ?? '');
    return /["\r\n]/.test(s) || s.includes(d) ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(d)).join('\r\n');
}

const words = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
const letterWords = s => words(s).filter(w => !/\d/.test(w));

function guessColumn(cols, title) {
  const tw = new Set(words(title));
  let best = null, bestScore = 0.34;
  for (const c of cols) {
    if (!c.label) continue;
    let s = words(c.label).filter(w => tw.has(w)).length / Math.max(1, tw.size);
    if (/comment/i.test(c.label)) s -= 1;
    if (/score/i.test(c.label)) s += 0.1;
    if (s > bestScore) { bestScore = s; best = c.j; }
  }
  return best;
}

// Rows of the export that hold a student: a cell (or two neighbouring cells) that reads like a person's name.
const HEADER_WORDS = new Set(['student', 'students', 'name', 'names', 'class', 'period', 'average', 'total', 'assignment', 'score', 'points', 'grade', 'teacher', 'date', 'first', 'last', 'export', 'jupiter', 'report', 'roster', 'gradebook']);
function studentRows(rows) {
  const out = [];
  rows.forEach((row, r) => {
    for (let i = 0; i < Math.min(4, row.length); i++) {
      const options = [[row[i], (row[i] || '').includes(',')], [i + 1 < row.length ? `${row[i]} ${row[i + 1]}` : '', false]];
      let found = null;
      for (const [cand, comma] of options) {
        if (!cand || /\d/.test(cand)) continue;
        const t = letterWords(cand);
        if (t.length < 2 || t.length > 5 || t.some(w => HEADER_WORDS.has(w))) continue;
        if (!found || (comma && !found.comma)) found = { r, label: cand.trim().replace(/\s+/g, ' '), tokens: t, comma };
      }
      if (found) { out.push(found); break; }
    }
  });
  return out;
}

function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const t = d[j];
      d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = t;
    }
  }
  return d[b.length];
}
function tokSim(a, b) {
  if (a.length === 1) return b[0] === a ? 0.6 : 0;
  let s = 1 - lev(a, b) / Math.max(a.length, b.length);
  if (a.length >= 3 && b.startsWith(a)) s = Math.max(s, 0.9);
  return s;
}
// Names come from handwriting, so match loosely and in any order ("Mendez, Nathaly" = "Nathaly Mendez").
function similarity(name, student) {
  const A = letterWords(name);
  if (!A.length) return 0;
  const mean = A.reduce((s, a) => s + Math.max(...student.tokens.map(b => tokSim(a, b))), 0) / A.length;
  return mean * Math.min(1, A.length / Math.min(student.tokens.length, 2));
}
// Who wrote a sheet, from the handwriting reading ("roah Sim" → Noah Kim). Each student gets a probability: how close
// the reading is once letters handwriting recognition mixes up are allowed for, weighed by their period and whether
// they already have a scan for this test. The same method as the phone (NameMatch.swift).
const LOOKALIKES = ['nrmhuvw', 'aoecdqgu', 'iljtfry', 'szkxg', 'bhkld', 'pqgyj'];
const lookalike = (a, b) => LOOKALIKES.some(g => g.includes(a) && g.includes(b));
function wordCost(a, b) {
  if (a === b) return 0;
  if (a.length === 1) return b[0] === a ? 0.3 : 1;
  const gap = 0.8, row = Array.from({ length: b.length + 1 }, (_, j) => j * gap);
  for (let i = 1; i <= a.length; i++) {
    let diagonal = row[0];
    row[0] = i * gap;
    for (let j = 1; j <= b.length; j++) {
      const above = row[j];
      row[j] = Math.min(above + gap, row[j - 1] + gap, diagonal + (a[i - 1] === b[j - 1] ? 0 : lookalike(a[i - 1], b[j - 1]) ? 0.4 : 1));
      diagonal = above;
    }
  }
  return row[b.length] / Math.max(a.length, b.length);
}
// Word by word, in any order; a left-out word costs a little (often just a first name), an extra word more.
function nameDistance(read, name) {
  if (!read.length || !name.length) return 1.5;
  let best = Infinity;
  const pair = (i, used, cost) => {
    if (cost >= best) return;
    if (i === read.length) {
      best = Math.min(best, cost + 0.35 * Math.max(0, name.length - used.size) + 0.5 * Math.max(0, read.length - used.size));
      return;
    }
    let paired = false;
    name.forEach((w, j) => { if (!used.has(j)) { paired = true; pair(i + 1, new Set([...used, j]), cost + wordCost(read[i], w)); } });
    if (!paired || read.length > name.length) pair(i + 1, used, cost);
  };
  pair(0, new Set(), 0);
  return best / read.length;
}
function nameGuesses(read, period, taken = new Set()) {
  const w = letterWords(read);
  if (!w.length) return [];
  const T = 0.08;
  const scored = students.map(st => {
    const d = nameDistance(w, letterWords(st.name));
    let weight = Math.exp(-d / T);
    if (period && st.period === period) weight *= 2;
    if (taken.has(st.id)) weight *= 0.2;
    return { st, d, weight };
  });
  const total = scored.reduce((sum, x) => sum + x.weight, Math.exp(-0.55 / T));   // or someone not on the list
  return scored.map(x => ({ st: x.st, p: x.weight / total, d: x.d })).sort((a, b) => b.p - a.p || a.st.name.localeCompare(b.st.name));
}
// Assign when the reading is clearly one student; suggest (one click to confirm) when it's probably them.
function nameDecide(read, period, taken) {
  const [top] = nameGuesses(read, period, taken);
  if (!top) return {};
  if (top.p >= 0.85 && top.d <= 0.3) return { assign: top.st };
  if (top.p >= 0.5 && top.d <= 0.6) return { suggest: top.st };
  return {};
}

function autoMatch(results, students) {
  const pairs = [];
  results.forEach((res, i) => students.forEach((st, j) => {
    const s = similarity(res.name, st);
    if (s >= 0.5) pairs.push({ i, j, s });
  }));
  pairs.sort((a, b) => b.s - a.s);
  const byResult = new Map(), taken = new Set();
  for (const p of pairs) {
    if (byResult.has(p.i) || taken.has(p.j)) continue;
    byResult.set(p.i, { j: p.j, s: p.s }); taken.add(p.j);
  }
  return byResult;
}

function jupiterDialog(q) {
  const { el } = dialog(`<h2 class="h3">Send scores to Jupiter</h2>
    <ol class="steps muted"><li>In Jupiter, go to <b>Setup › Import/Export › Export Assignments as Spreadsheet</b>. Choose this assignment and all your classes.</li>
      <li>Drop that file below. Scores are matched to students by name.</li>
      <li>Download the filled file. In Jupiter, go to <b>Setup › Import/Export › Import Assignments from Spreadsheet</b>, review, and save.</li></ol>
    <label class="drop" id="drop">${icon('upload')}<span><b>Drop the exported file here</b> or click to choose</span><input type="file" id="jf" accept=".csv,.txt,.tsv" hidden></label>
    <details class="paste"><summary>Paste cells instead</summary><textarea class="input" id="jt" rows="4" placeholder="Paste the cells copied from Excel"></textarea>
      <button class="btn outline sm" id="jgo">Use pasted cells</button></details>
    <div id="jout"></div>`, true);
  const drop = $('#drop', el);
  const use = text => readJupiter(q, text, el);
  $('#jf', el).onchange = async e => { const f = e.target.files[0]; if (f) use(await f.text(), f.name); };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = async e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) { el.dataset.name = f.name; use(await f.text()); } };
  $('#jf', el).addEventListener('change', e => { if (e.target.files[0]) el.dataset.name = e.target.files[0].name; });
  $('#jgo', el).onclick = () => { el.dataset.name = ''; use($('#jt', el).value); };
}

function readJupiter(q, text, el) {
  const out = $('#jout', el);
  if (!text.trim()) return void (out.innerHTML = '<p class="err">That file is empty.</p>');
  const bom = text.startsWith('﻿'); if (bom) text = text.slice(1);
  const delim = text.split(/\r?\n/).slice(0, 20).some(l => l.includes('\t')) ? '\t' : ',';
  const rows = parseDelimited(text, delim), students = studentRows(rows);
  if (!students.length) return void (out.innerHTML = '<p class="err" style="margin-top:12px">No student names found in this file. Export it from Jupiter as described above.</p>');
  const header = rows.slice(0, students[0].r), width = Math.max(...rows.map(r => r.length));
  const cols = Array.from({ length: width }, (_, j) => ({ j, label: header.map(h => (h[j] || '').trim()).filter(Boolean).join(' · ') }));
  const results = rowsOf(q), max = grade(q, '').max;
  const match = autoMatch(results, students);
  const pick = new Map([...match].map(([i, m]) => [i, m.j]));
  let col = guessColumn(cols, q.title);
  const name = (el.dataset.name || '').replace(/(\.\w+)?$/, m => '-filled' + (m || (delim === '\t' ? '.txt' : '.csv'))) || 'jupiter-import-filled.csv';
  const status = i => {
    const m = match.get(i);
    if (!pick.has(i)) return '<span class="badge destructive">No match</span>';
    if (m && m.j === pick.get(i) && m.s < 0.85) return '<span class="badge warning">Check</span>';
    return '<span class="badge success">Matched</span>';
  };
  const filled = () => {
    const outRows = rows.map(r => r.slice());
    for (const [i, j] of pick) {
      const r = students[j].r;
      while (outRows[r].length <= col) outRows[r].push('');
      outRows[r][col] = fmt(results[i].final);
    }
    return outRows;
  };
  const draw = () => {
    const used = new Map([...pick].map(([i, j]) => [j, i]));
    const nMatched = [...pick.keys()].length, nCheck = results.filter((_, i) => match.get(i) && match.get(i).s < 0.85 && pick.get(i) === match.get(i).j).length;
    out.innerHTML = `<div class="jfoot"><label class="field" style="min-width:280px"><span>Score column</span><select class="input" id="jcol"><option value="">Choose the column for this test…</option>${cols.map(c =>
      `<option value="${c.j}" ${c.j === col ? 'selected' : ''}>Column ${c.j + 1}${c.label ? ': ' + esc(c.label.slice(0, 70)) : ''}</option>`).join('')}</select></label>
      <div class="muted">${nMatched} matched · ${nCheck} to check · ${results.length - nMatched} not found</div></div>
      <div class="jtable"><table class="table"><thead><tr><th>Scan</th><th>Jupiter student</th><th class="num">Score</th><th></th></tr></thead><tbody>${results.map((r, i) => `<tr>
        <td class="student"><div class="who"><span>${esc(r.name || 'No name')}${r.s.period ? ` <span class="muted">· P${r.s.period}</span>` : ''}</span>${r.s.name_image ? `<img class="hand" src="${esc(r.s.name_image)}" alt="">` : ''}</div></td>
        <td><select class="input" data-i="${i}"><option value="">Not in this file</option>${students.map((st, j) =>
          `<option value="${j}" ${pick.get(i) === j ? 'selected' : ''}>${esc(st.label)}${used.has(j) && used.get(j) !== i ? ' (used)' : ''}</option>`).join('')}</select></td>
        <td class="num">${fmt(r.final)} <span class="muted">/ ${fmt(max)}</span></td><td>${status(i)}</td></tr>`).join('')}</tbody></table></div>
      <div class="actions" style="margin-top:16px"><button class="btn outline" id="jcopy">Copy for Jupiter</button><button class="btn primary" id="jdl">Download filled file</button></div>`;
    $('#jcol', el).onchange = e => { col = e.target.value === '' ? null : Number(e.target.value); };
    $$('[data-i]', el).forEach(s => s.onchange = () => { const i = Number(s.dataset.i); if (s.value === '') pick.delete(i); else pick.set(i, Number(s.value)); draw(); });
    const ready = () => { if (col == null) { toast('Choose the score column first.', true); return false; } return true; };
    $('#jdl', el).onclick = () => { if (ready()) download(name, (bom ? '﻿' : '') + toDelimited(filled(), delim), 'text/plain'); };
    $('#jcopy', el).onclick = async () => { if (!ready()) return; await navigator.clipboard.writeText(toDelimited(filled(), '\t')); toast('Copied. Paste it into Jupiter’s import box.'); };
  };
  draw();
}
</script>
